server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # === ЗАГОЛОВКИ БЕЗОПАСНОСТИ (Security Headers) ===

    # Защита от clickjacking (запрет встраивания сайта в iframe)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Защита от MIME-sniffing атак
    add_header X-Content-Type-Options "nosniff" always;

    # Защита от XSS (дополнительный слой для старых браузеров)
    add_header X-XSS-Protection "1; mode=block" always;

    # Запрет отправки Referer при переходе на внешние сайты
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — разрешаем только доверенные источники
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://www.gstatic.com https://*.firebaseapp.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://*.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com https://maps.google.com; frame-src https://accounts.google.com https://*.firebaseapp.com;" always;

    # Запрет утечки данных через Permissions-Policy
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=()" always;

    # === КЭШИРОВАНИЕ И СЖАТИЕ ===

    # Сжатие gzip для текстовых ресурсов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Кеширование статики (иконки, шрифты) на 30 дней
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML и JS — минимальный кеш для быстрого обновления при git push
    location ~* \.(html|js|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # === ЗАЩИТА ОТ УТЕЧКИ ВНУТРЕННИХ ФАЙЛОВ ===

    # Запрет доступа к скрытым файлам и папкам (.git, .env, .agents и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запрет доступа к конфигурационным файлам
    location ~* (Dockerfile|docker-compose\.yml|\.dockerignore|antigravity_debug\.log|firestore\.rules)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # === МАРШРУТИЗАЦИЯ SPA ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Отключение отображения версии NGINX в заголовках
    server_tokens off;
}
